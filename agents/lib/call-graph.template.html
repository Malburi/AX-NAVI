<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{PROJECT_NAME}} Call Graph</title>
  <style>{{VIS_NETWORK_CSS}}</style>
  <script>{{VIS_NETWORK_JS}}</script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .header { background: rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.1); padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
    .header h1 { font-size: 18px; font-weight: 700; color: #fff; }
    .header .subtitle { font-size: 11px; color: #888; margin-top: 2px; }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    #searchInput { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; padding: 6px 12px; color: #fff; font-size: 13px; width: 200px; outline: none; }
    #searchInput::placeholder { color: #666; }
    #searchInput:focus { border-color: #4A90D9; }
    .filter-bar { background: rgba(0,0,0,0.3); border-bottom: 1px solid rgba(255,255,255,0.07); padding: 8px 20px; display: flex; gap: 8px; align-items: center; flex-shrink: 0; flex-wrap: wrap; }
    .filter-bar span.label { font-size: 11px; color: #888; margin-right: 4px; }
    .filter-spacer { flex: 1; }
    .filter-btn { padding: 4px 12px; border-radius: 20px; border: 1px solid; font-size: 11px; cursor: pointer; transition: all .2s; font-weight: 600; background: transparent; }
    .filter-btn.active { opacity: 1; }
    .filter-btn:not(.active) { opacity: 0.35; }
    .filter-btn[data-type="all"]      { border-color: #aaa;     color: #aaa; }
    .filter-btn[data-type="view"],
    .filter-btn[data-type="vue_view"]      { border-color: #E74C3C;  color: #E74C3C; }
    .filter-btn[data-type="endpoint"]      { border-color: #4A90D9;  color: #4A90D9; }
    .filter-btn[data-type="function"]      { border-color: #9B59B6;  color: #9B59B6; }
    .filter-btn[data-type="dao"]           { border-color: #2E86C1;  color: #2E86C1; }
    .filter-btn[data-type="external"],
    .filter-btn[data-type="sap_interface"] { border-color: #F5A623;  color: #F5A623; }
    .filter-btn[data-type="db_table"],
    .filter-btn[data-type="mssql_table"]   { border-color: #7ED321;  color: #7ED321; }
    .filter-btn[data-type="util"]          { border-color: #48C9B0;  color: #48C9B0; }
    .tool-btn { padding: 4px 12px; border-radius: 20px; border: 1px solid #4A90D9; color: #4A90D9; font-size: 11px; cursor: pointer; font-weight: 600; background: transparent; }
    .tool-btn.active { background: rgba(74,144,217,0.18); }
    .main { display: flex; flex: 1; overflow: hidden; }
    #graph { flex: 1; background: #0f0f1e; }
    #detail { width: 280px; background: rgba(255,255,255,0.04); border-left: 1px solid rgba(255,255,255,0.08); padding: 16px; overflow-y: auto; flex-shrink: 0; }
    #detail h3 { font-size: 13px; color: #aaa; margin-bottom: 12px; text-transform: uppercase; letter-spacing: .5px; }
    #detail .empty { color: #555; font-size: 13px; line-height: 1.6; }
    .detail-card { background: rgba(255,255,255,0.06); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .detail-card .label { font-size: 10px; color: #888; text-transform: uppercase; margin-bottom: 4px; }
    .detail-card .value { font-size: 13px; color: #e0e0e0; word-break: break-all; }
    .detail-card .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; margin-top: 6px; }
    .conn-list { list-style: none; }
    .conn-list li { font-size: 12px; color: #ccc; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .conn-list li:last-child { border-bottom: none; }
    .conn-arrow { color: #4A90D9; margin-right: 4px; }
    .conn-note { font-size: 11px; color: #888; font-style: italic; margin: 2px 0 0 0; }
    .stat-hero { background: rgba(255,255,255,0.05); border-radius: 8px; padding: 14px; text-align: center; margin-bottom: 16px; }
    .stat-num { font-size: 32px; font-weight: 800; color: #4A90D9; line-height: 1.2; }
    .stat-caption { font-size: 12px; color: #ccc; margin-top: 4px; }
    .stat-sub { font-size: 11px; color: #888; margin-top: 4px; }
    .legend-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 4px 10px; margin-bottom: 4px; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .legend-note { grid-column: 1 / -1; font-size: 11px; color: #888; margin-top: 2px; }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1>🗺️ {{PROJECT_NAME}} Call Graph</h1>
      <div class="subtitle">정적 분석 기반 · 런타임 동적 호출 미포함 · {{STACK_DESCRIPTION}}</div>
    </div>
    <div class="header-right">
      <input id="searchInput" type="text" placeholder="노드 검색..." />
    </div>
  </div>

  <div class="filter-bar">
    <button id="backToModulesBtn" class="tool-btn active" style="display:none">← 모듈 개요로</button>
    <span class="label" id="filterLabel">필터:</span>
    <button class="filter-btn active" data-type="all">전체</button>
    {{FILTER_BUTTONS}}
    <div class="filter-spacer"></div>
    <button id="flatViewBtn" class="tool-btn">전체 함수 그래프(고급)</button>
    <button id="findBtn" class="tool-btn">찾기</button>
    <button id="resetHighlightBtn" class="tool-btn">강조 초기화</button>
    <button id="collapseToHubBtn" class="tool-btn">초기 뷰로</button>
    <button id="physicsToggle" class="tool-btn">물리엔진</button>
  </div>

  <div class="main">
    <div id="graph"></div>
    <div id="detail">
      <h3>그래프 정보</h3>
      <div id="viewModeLabel" style="font-size:12px;color:#9fd3ff;font-weight:600;margin-bottom:10px;"></div>
      {{STAT_SUMMARY}}
      <h3>범례</h3>
      <div class="legend-grid">
        {{LEGEND_ITEMS}}
      </div>
      <hr style="border-color:rgba(255,255,255,0.08);margin:16px 0;" />
      <h3>선택 노드</h3>
      <div id="detailContent" class="empty">노드를 클릭하세요.</div>
    </div>
  </div>

  <script>
    const COLORS = {{COLORS}};
    const nodeTypeMap = {};

    function nodeColor(type) {
      const c = COLORS[type] || { bg: '#1e293b', border: '#334155' };
      return { background: c.bg, border: c.border, highlight: { background: c.border, border: '#fff' } };
    }

    function nodeShape(type) {
      const shapes = {
        view: 'ellipse', vue_view: 'ellipse',
        endpoint: 'box',
        entrypoint: 'star', ui_event: 'dot',
        function: 'hexagon', dao: 'hexagon',
        external: 'diamond', sap_interface: 'diamond',
        db_table: 'database', mssql_table: 'database',
        util: 'dot'
      };
      return shapes[type] || 'dot';
    }

    function mkNode(id, label, type, extra = {}) {
      const c = COLORS[type] || { bg: '#1e293b', border: '#334155', font: '#e0e0e0' };
      nodeTypeMap[id] = type;
      return {
        id, label,
        color: nodeColor(type),
        font: { color: c.font || '#e0e0e0', size: 12 },
        shape: nodeShape(type),
        borderWidth: 2,
        shadow: true,
        ...extra
      };
    }

    const nodesData = {{NODES_DATA}};
    const nodeById = new Map(nodesData.map(n => [n.id, n]));
    const baseOpacity = {};
    nodesData.forEach(n => { baseOpacity[n.id] = n.opacity ?? 1; });

    function edge(from, to, label = '', dashed = false, edgeType = 'call', note = '') {
      const isReflect = edgeType === 'reflect';
      return {
        from, to, label, edgeType, note, arrows: 'to', dashes: dashed,
        color: { color: isReflect ? 'rgba(245,166,35,0.55)' : 'rgba(150,150,200,0.4)', highlight: isReflect ? '#F5A623' : '#4A90D9' },
        font: { size: 9, color: '#999', align: 'middle' },
        smooth: { type: 'curvedCW', roundness: 0.1 }
      };
    }

    const EDGE_TYPE_LABEL = {
      call: '호출', inject: 'DI 주입', inherit: '상속/구현',
      reflect: '리플렉션(추정)', depends: '의존', query: 'DB 쿼리'
    };

    const edgesData = {{EDGES_DATA}};
    edgesData.forEach((e, i) => { e.id = i; });  // 증분 add/remove 추적용 안정적 id
    const META = {{META}};

    // data_flow.json 기반 엔드포인트별 처리 흐름(메서드 체인 → SQL → 읽기/쓰기 테이블 + 서술).
    // 키는 api_contract.json의 엔드포인트 id이며, 노드의 META[id].endpointIds로 조회한다.
    // 노드·엣지를 만들지 않는 메타데이터 전용 — 이유는 wiki_generator.build_endpoint_flows 주석 참조.
    const FLOWS = {{FLOWS}};

    // 상세 패널은 지금까지 값을 innerHTML에 그대로 보간했다. note가 61개(2.5%)일 때는 우연히
    // 문제가 없었지만, 엔드포인트 설명 421개 + 흐름 서술 330개가 새로 흘러들어오면서 코드를
    // 설명하는 한글 문장의 "List<String>을 반환" 같은 '<' 하나로 카드가 깨지고 최악의 경우
    // 스크립트가 주입된다. 모든 자유 텍스트 보간 지점을 esc()로 통과시킨다.
    const _ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
    function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, ch => _ESC[ch]); }

    // 노드 하나가 관여하는 엣지를 O(1)로 찾기 위한 인덱스 — 노드를 펼칠 때(revealNeighbors)
    // "이 노드와 이미 화면에 있는 다른 노드 사이의 엣지"를 매번 3,761개 전체를 스캔하지
    // 않고 바로 조회한다.
    const edgesByNode = new Map();
    function indexEdge(nid, e) {
      if (!edgesByNode.has(nid)) edgesByNode.set(nid, []);
      edgesByNode.get(nid).push(e);
    }
    edgesData.forEach(e => { indexEdge(e.from, e); indexEdge(e.to, e); });

    const allTypes = [...new Set(nodesData.map(n => nodeTypeMap[n.id]))];
    const activeTypes = new Set(allTypes);

    // ---- 대형 그래프 성능의 핵심: vis-network DataSet에는 "실제로 펼쳐진(expanded)" 노드만
    // 올린다. 예전 방식(전체 3,857개를 DataSet에 넣고 hidden 플래그만 토글)은 필터 버튼·검색
    // 입력·강조 초기화·더블클릭 등 거의 모든 인터랙션이 "3,857개 전부를 순회하며 개별
    // nodes.update() 호출"이 되어, 물리엔진을 꺼도 클릭할 때마다 느렸다. 이제 "화면에 없는
    // 노드는 DataSet에도 없다"로 바꿔서, 모든 인터랙션 비용이 (숨겨진 개수가 아니라) 실제
    // 펼쳐진 개수에만 비례하게 한다. expandedIds에 있는 id는 항상 DataSet에도 존재하고,
    // 항상 유효한 x/y를 갖는다(모듈 상세뷰의 초기 표시분은 물리엔진이, 전체 그래프뷰는
    // wiki_generator.py가 미리 구운 좌표가 배치를 담당하고, 나중에 펼친 것은 아래
    // revealNeighbors가 이웃 평균+지터로 즉시 배치한다).
    const expandedIds = new Set();

    // ---- 뷰 상태: 'module'(모듈/패키지 요약, 기본) | 'function'(실제 함수 호출 그래프) ----
    // 3,857개 함수를 한 캔버스에 다 뿌리는 게 "구조를 훑어본다"는 목적과 안 맞는다는 피드백에
    // 따라, 기본 화면을 모듈 단위 요약으로 바꿨다. 모듈을 클릭하면 그 모듈 내부의 실제 호출
    // 관계만 보여주는 'function' 뷰로 드릴다운한다(currentModule에 어느 모듈인지 기록).
    // currentModule이 null이면 "전체 함수 그래프(고급)" 모드 — 예전 기본 화면(전역 허브+이웃
    // 955개)과 동일하며, revealNeighbors 등 기존에 검증한 로직을 그대로 재사용한다.
    let currentView = 'module';
    let currentModule = null;
    // "초기 뷰로" 버튼이 되돌아갈 대상 — enterFunctionView가 매번 갱신한다(전체 뷰면 전역
    // 허브+이웃, 모듈 상세뷰면 그 모듈의 초기 축소 집합).
    let collapseTargetIds = new Set();

    function positionNear(anchorPos, jitter = 60) {
      return {
        x: anchorPos.x + (Math.random() - 0.5) * jitter,
        y: anchorPos.y + (Math.random() - 0.5) * jitter
      };
    }

    function centroidOfPositioned(ids) {
      const known = ids.filter(id => expandedIds.has(id));  // expandedIds의 모든 원소는 항상 좌표를 가짐
      if (!known.length) return null;
      const pts = network.getPositions(known);  // 현재 렌더된 위치 — 물리엔진을 이미
                                                  // 한 번 돌린 뒤에도 정확함(DataSet의 x/y는
                                                  // 그때부터 stale해지지만 Network의 실시간
                                                  // 위치는 그렇지 않음)
      const cx = known.reduce((s, id) => s + pts[id].x, 0) / known.length;
      const cy = known.reduce((s, id) => s + pts[id].y, 0) / known.length;
      return { x: cx, y: cy };
    }

    // id를 화면에 추가한다(이미 있으면 아무것도 안 함). 좌표가 없는 신규 노드는 anchorPos
    // 주변에 지터를 줘서 배치한다.
    function addNodeToGraph(id, anchorForNewPos) {
      if (expandedIds.has(id)) return false;
      const src = nodeById.get(id);
      const pos = (typeof src.x === 'number') ? { x: src.x, y: src.y } : positionNear(anchorForNewPos || { x: 0, y: 0 }, 80);
      expandedIds.add(id);
      nodes.add({ ...src, hidden: !activeTypes.has(nodeTypeMap[id]), x: pos.x, y: pos.y });
      return true;
    }

    // id와 "이미 펼쳐진" 다른 노드 사이의 엣지를 전부 연결한다. vis-network는 엣지의 양 끝
    // 노드가 모두 hidden이 아닐 때만 보여주므로, 두 끝이 다 expandedIds에 있으면 항상 넣어도
    // 안전하다(hidden 계산은 노드 쪽에서만 함).
    function connectEdgesFor(id) {
      const toAdd = [];
      (edgesByNode.get(id) || []).forEach(e => {
        const other = e.from === id ? e.to : e.from;
        if (expandedIds.has(other) && !addedEdgeIds.has(e.id)) {
          toAdd.push(e);
          addedEdgeIds.add(e.id);
        }
      });
      if (toAdd.length) edges_ds.add(toAdd);
    }

    // 모듈 상세뷰(currentModule이 설정된 상태)에서는 그 모듈 밖의 이웃까지 펼치면 "이 모듈만
    // 본다"는 드릴다운 의미가 깨지므로, 펼쳐지는 이웃을 같은 모듈로 제한한다. 전체 함수
    // 그래프(고급, currentModule===null)에서는 제한 없이 전부 펼친다(예전 동작 그대로).
    function inScope(nid) {
      if (currentModule === null) return true;
      // 타입 기반 가상 모듈(DB 테이블/외부 시스템/생성 코드/외부 라이브러리)은 내부 호출
      // 관계가 원래 없으므로 스코프 제한을 풀지 않으면 클릭해도 계속 빈 화면만 나온다.
      if (PSEUDO_MODULE_KEYS.has(currentModule)) return true;
      const n = nodeById.get(nid);
      return !!n && n.module === currentModule;
    }

    // 노드를 펼친다 — 자기 자신 + 직접 연결된 이웃(양방향, 현재 스코프 내)을 화면에 추가한다.
    function revealNeighbors(id) {
      const wasAbsent = addNodeToGraph(id, null);
      if (wasAbsent) {
        // 자기 자신 위치는 "이미 펼쳐진 이웃들의 평균" 쪽이 원점 폴백보다 낫다 — 다시 배치.
        const neighborIds = (edgesByNode.get(id) || []).map(e => (e.from === id ? e.to : e.from));
        const c = centroidOfPositioned(neighborIds);
        if (c) nodes.update({ id, ...positionNear(c, 80) });
      }
      connectEdgesFor(id);

      const anchor = network.getPositions([id])[id];
      const newNodes = [];
      (edgesByNode.get(id) || []).forEach(e => {
        const nb = e.from === id ? e.to : e.from;
        if (!inScope(nb)) return;
        if (addNodeToGraph(nb, anchor)) newNodes.push(nb);
      });
      newNodes.forEach(connectEdgesFor);
    }

    const container = document.getElementById('graph');
    // DataSet은 빈 채로 시작한다 — 실제 내용은 아래 renderModuleOverview()/enterFunctionView()가
    // 뷰 전환 시점에 채운다. nodesData/edgesData/edgesByNode에 전체 데이터가 그대로 있으므로
    // 손실 없이 필요한 만큼만 add()된다.
    const addedEdgeIds = new Set();
    const nodes = new vis.DataSet([]);
    const edges_ds = new vis.DataSet([]);
    // 노드·엣지가 많으면(임계값은 wiki_generator.py에서 결정) 기본 물리엔진 OFF + 동적 엣지
    // 스무딩(가장 비싼 렌더 옵션) OFF — 대형 그래프에서 로딩이 급격히 느려지는 걸 막는다.
    // 물리엔진은 토글 버튼으로 언제든 켤 수 있고, 켰다가 안정화가 끝나면 자동으로 다시 꺼서
    // (stabilizationIterationsDone) 드래그·줌 중 불필요한 시뮬레이션 재계산을 막는다.
    let physicsOn = false;  // 모듈 개요는 항상 사전 배치 좌표로 시작 — 물리엔진 불필요
    const network = new vis.Network(container, { nodes, edges: edges_ds }, {
      physics: {
        enabled: physicsOn, solver: 'forceAtlas2Based',
        forceAtlas2Based: { gravitationalConstant: -60, centralGravity: 0.005, springLength: 120, springConstant: 0.04, damping: 0.4 },
        stabilization: { iterations: 250 }
      },
      interaction: { hover: true, tooltipDelay: 200, navigationButtons: false, keyboard: false, hideEdgesOnDrag: true, hideEdgesOnZoom: true },
      edges: { width: 1.2, smooth: {{EDGE_SMOOTH_DYNAMIC}} ? { type: 'dynamic' } : false },
      nodes: { borderWidth: 2, shadow: true },
      layout: { improvedLayout: true }
    });

    // ---- 모듈(패키지) 요약 뷰 ----
    const MODULE_NODES = {{MODULE_NODES}};
    const MODULE_EDGES = {{MODULE_EDGES}};
    const moduleById = new Map(MODULE_NODES.map(m => [m.id, m]));

    // 코드 폴더가 아니라 "타입"으로 묶인 가상 모듈(wiki_generator.py module_candidate()의
    // 확정 반환값과 정확히 일치해야 한다) — 테이블끼리, 외부 시스템끼리, 생성 코드끼리는
    // 서로를 호출하지 않으므로 내부 호출 관계가 원래 없다. 이런 모듈은 드릴다운해도
    // "내부만 보기" 제한을 풀어서 실제로 의미 있는 정보(예: 이 테이블을 누가 쓰는지)인
    // 크로스 모듈 관계를 볼 수 있게 한다.
    const PSEUDO_MODULE_KEYS = new Set(["🗄 DB 테이블", "🔶 외부 시스템", "⚙️ 생성 코드", "📦 외부 라이브러리", "🌐 API 엔드포인트"]);

    function mkModuleNode(m) {
      return {
        id: 'module:' + m.id, label: m.label + '\n(' + m.count + '개)',
        shape: 'box', margin: 10,
        color: { background: '#22314f', border: '#4A90D9', highlight: { background: '#2e4166', border: '#fff' } },
        font: { color: '#e8eefc', size: 13 },
        borderWidth: 2, shadow: true,
        x: m.x, y: m.y
      };
    }
    function mkModuleEdge(e) {
      return {
        from: 'module:' + e.from, to: 'module:' + e.to,
        label: String(e.count), arrows: 'to',
        width: Math.min(8, 1 + Math.log2(e.count + 1)),
        color: { color: 'rgba(150,150,200,0.5)', highlight: '#4A90D9' },
        font: { size: 10, color: '#999', align: 'middle' },
        smooth: { type: 'curvedCW', roundness: 0.15 }
      };
    }

    function moduleMemberIds(moduleKey) {
      return nodesData.filter(n => n.module === moduleKey).map(n => n.id);
    }

    // 필터바·검색·강조초기화 등은 'function' 뷰에서만 의미가 있다 — 모듈 뷰에서는 숨긴다.
    function updateChromeForView() {
      const inFn = currentView === 'function';
      document.getElementById('backToModulesBtn').style.display = inFn ? '' : 'none';
      document.getElementById('filterLabel').style.display = inFn ? '' : 'none';
      document.querySelectorAll('.filter-btn').forEach(b => { b.style.display = inFn ? '' : 'none'; });
      document.getElementById('resetHighlightBtn').style.display = inFn ? '' : 'none';
      document.getElementById('physicsToggle').style.display = inFn ? '' : 'none';
      document.getElementById('flatViewBtn').style.display = inFn ? 'none' : '';
      const totalForScope = currentModule === null ? nodesData.length : moduleMemberIds(currentModule).length;
      document.getElementById('collapseToHubBtn').style.display = (inFn && collapseTargetIds.size < totalForScope) ? '' : 'none';
      updateViewModeLabel();
    }

    // 우측 정보 패널 상단에 현재 보고 있는 레벨을 표시한다 — "전체 모듈 개요" 또는
    // "[모듈명] 내부 — 노드 N개"(전체 함수 그래프(고급)일 때는 그 사실을 그대로 표시).
    function updateViewModeLabel() {
      const el = document.getElementById('viewModeLabel');
      if (!el) return;
      if (currentView === 'module') {
        el.textContent = '현재 모드: 전체 모듈 개요';
      } else if (currentModule === null) {
        el.textContent = '현재 모드: 전체 함수 그래프(고급)';
      } else {
        const m = moduleById.get(currentModule);
        const memberCount = m ? (m.member_count ?? m.count) : moduleMemberIds(currentModule).length;
        el.textContent = `현재 모드: [${currentModule}] 내부 — 노드 ${memberCount}개`;
      }
    }

    function renderModuleOverview() {
      currentView = 'module';
      currentModule = null;
      expandedIds.clear(); addedEdgeIds.clear();
      nodes.clear(); edges_ds.clear();
      nodes.add(MODULE_NODES.map(mkModuleNode));
      edges_ds.add(MODULE_EDGES.map(mkModuleEdge));
      physicsOn = false;
      network.setOptions({ physics: { enabled: false } });
      syncPhysicsBtn();
      // 다른 모듈과 실제로 연결된(cross-module edge가 있는) 모듈만 기준으로 확대한다.
      // 고립 모듈은 화면 밖으로 안 나가게 원형으로 배치되지만 반지름이 크므로, 전체
      // 노드 기준으로 fit()하면 정작 중요한 연결된 군집이 작게 찌그러져 보였다.
      const connectedModuleIds = MODULE_NODES.filter(m => m.connected).map(m => 'module:' + m.id);
      network.fit(connectedModuleIds.length ? { nodes: connectedModuleIds } : undefined);
      updateChromeForView();
      const dc = document.getElementById('detailContent');
      dc.classList.add('empty');
      dc.innerHTML = '모듈을 클릭하면 내부 호출 관계를 볼 수 있습니다.';
    }

    // moduleKey가 null이면 "전체 함수 그래프(고급)" — 예전 기본 화면(전역 허브+이웃)과 동일하다.
    // moduleKey가 있으면 그 모듈 내부만 스코프로 삼는다(크면 모듈 내부 in-degree 기준
    // 허브+이웃만 초기 표시 — 전역 그래프와 같은 원리를 모듈 스코프로 좁혀 재사용).
    function enterFunctionView(moduleKey) {
      currentView = 'function';
      currentModule = moduleKey;
      expandedIds.clear(); addedEdgeIds.clear();
      nodes.clear(); edges_ds.clear();

      let seedIds;
      if (moduleKey === null) {
        seedIds = new Set(nodesData.filter(n => n.initial).map(n => n.id));
      } else {
        const memberSet = new Set(moduleMemberIds(moduleKey));
        const isPseudo = PSEUDO_MODULE_KEYS.has(moduleKey);
        const DETAIL_HUB_CAP = 250;
        if (memberSet.size <= DETAIL_HUB_CAP) {
          seedIds = memberSet;
        } else {
          // 타입 기반 가상 모듈(DB 테이블 등)은 내부 호출이 원래 없어 in-module in-degree가
          // 전부 0으로 나온다 — 순위를 매길 수 없으니 대신 전체 그래프 기준 degree(다른
          // 모듈에서 오는 실제 호출 포함)로 "많이 쓰이는 것부터" 상위를 고른다. 일반
          // 모듈은 내부 엣지가 압도적으로 많으므로 이 기준으로 바꿔도 결과가 거의 같다.
          const inDeg = {};
          memberSet.forEach(id => {
            (edgesByNode.get(id) || []).forEach(e => {
              if (e.to !== id) return;
              if (isPseudo || memberSet.has(e.from)) inDeg[id] = (inDeg[id] || 0) + 1;
            });
          });
          const ranked = [...memberSet].sort((a, b) => (inDeg[b] || 0) - (inDeg[a] || 0) || (a < b ? -1 : 1));
          const hubCount = Math.min(40, Math.max(15, Math.floor(memberSet.size / 20)));
          const hubs = new Set(ranked.slice(0, hubCount));
          seedIds = new Set(hubs);
          hubs.forEach(h => {
            (edgesByNode.get(h) || []).forEach(e => {
              const other = e.from === h ? e.to : e.from;
              // 가상 모듈은 다른 모듈에 속한 실제 호출자/피호출자도 함께 보여줘야
              // "관계"가 뭔가 나온다 — 같은 모듈로 제한하지 않는다.
              if (isPseudo || memberSet.has(other)) seedIds.add(other);
            });
          });
        }
      }

      seedIds.forEach(id => expandedIds.add(id));
      nodes.add([...seedIds].map(id => {
        const src = nodeById.get(id);
        return { ...src, hidden: !activeTypes.has(nodeTypeMap[id]) };
      }));
      const seedEdges = edgesData.filter(e => seedIds.has(e.from) && seedIds.has(e.to));
      seedEdges.forEach(e => addedEdgeIds.add(e.id));
      edges_ds.add(seedEdges);

      collapseTargetIds = new Set(seedIds);

      physicsOn = (moduleKey === null) ? {{PHYSICS_DEFAULT}} : (seedIds.size <= 250);
      network.setOptions({ physics: { enabled: physicsOn } });
      syncPhysicsBtn();
      network.fit();
      updateChromeForView();

      const dc = document.getElementById('detailContent');
      dc.classList.add('empty');
      dc.innerHTML = '노드를 클릭하세요.';
    }

    function syncPhysicsBtn() {
      const btn = document.getElementById('physicsToggle');
      btn.textContent = '물리엔진 ' + (physicsOn ? 'ON' : 'OFF');
      btn.classList.toggle('active', physicsOn);
    }
    syncPhysicsBtn();

    network.on('stabilizationIterationsDone', () => {
      if (!physicsOn) return;
      network.setOptions({ physics: { enabled: false } });
      physicsOn = false;
      syncPhysicsBtn();
    });

    function getLabel(id) {
      const n = nodeById.get(id);
      return n ? n.label.replace(/\n/g, ' ') : id;
    }

    function edgeTag(e) {
      const t = e.edgeType || 'call';
      const unsure = t === 'reflect' ? ' style="opacity:.6;font-style:italic"' : '';
      return `<span${unsure}>[${esc(EDGE_TYPE_LABEL[t] || t)}]</span> `;
    }

    // 엔드포인트 노드의 처리 흐름 카드 — data_flow.json이 준 "엔드포인트 → 메서드 체인 →
    // SQL → 읽기/쓰기 테이블 + 서술". 하나의 노드에 엔드포인트가 여러 개 매핑될 수 있어
    // (실측 최대 7개) endpointIds를 순회한다. 쓰기 테이블만 주황으로 강조하는 이유는
    // 그것이 부작용(side effect) 지점이라 영향도 판단에서 가장 먼저 봐야 하기 때문이다.
    function flowCards(m) {
      const ids = m.endpointIds || [];
      if (!ids.length) return '';
      return ids.map(eid => {
        const f = FLOWS[eid];
        if (!f) return '';
        const row = (label, body, color) =>
          `<div class="value" style="font-size:11px;margin-top:5px${color ? ';color:' + color : ''}">↳ ${label} ${body}</div>`;
        return `<div class="detail-card">
          <div class="label">처리 흐름${f.conf ? ' · 신뢰도 ' + esc(f.conf) : ''}</div>
          ${f.note ? `<div class="value" style="font-size:12px;line-height:1.65;white-space:pre-wrap">${esc(f.note)}</div>` : ''}
          ${f.nm ? row(`메서드 ${f.nm}개:`, esc(f.methods.join(' → ')) + (f.nm > f.methods.length ? ' …' : '')) : ''}
          ${f.nq ? row(`SQL ${f.nq}개:`, `<span style="font-family:monospace">${esc(f.sqls.join(', '))}</span>` + (f.nq > f.sqls.length ? ' …' : '')) : ''}
          ${f.tr && f.tr.length ? row('읽기:', esc(f.tr.join(', ')), '#7ED321') : ''}
          ${f.tw && f.tw.length ? row('쓰기:', esc(f.tw.join(', ')), '#F5A623') : ''}
        </div>`;
      }).join('');
    }

    function showDetail(id) {
      const dc = document.getElementById('detailContent');
      const m = META[id] || {};
      const lbl = getLabel(id);
      const type = nodeTypeMap[id];
      const c = COLORS[type];
      const typeColor = c ? c.border : '#aaa';
      const connEdges = edgesData.filter(e => e.from === id || e.to === id);
      const edgeNote = e => e.note ? `<div class="conn-note">${esc(e.note)}</div>` : '';
      const outgoing = connEdges.filter(e => e.from === id).map(e => `<li>${edgeTag(e)}<span class="conn-arrow">→</span>${esc(getLabel(e.to))}${edgeNote(e)}</li>`).join('');
      const incoming = connEdges.filter(e => e.to === id).map(e => `<li>${edgeTag(e)}<span class="conn-arrow">←</span>${esc(getLabel(e.from))}${edgeNote(e)}</li>`).join('');

      const badges = [];
      if (m.type) badges.push(`<span class="badge" style="background:${typeColor}22;color:${typeColor};border:1px solid ${typeColor}">${esc(m.type)}</span>`);
      if (m.visibility) badges.push(`<span class="badge" style="background:#33333322;color:#ccc;border:1px solid #555">${esc(m.visibility)}</span>`);
      if (m.static) badges.push(`<span class="badge" style="background:#33333322;color:#ccc;border:1px solid #555">static</span>`);
      if (m.hub) badges.push(`<span class="badge" style="background:#4A90D922;color:#4A90D9;border:1px solid #4A90D9">◎ 허브 (in ${m.inDegree})</span>`);
      if (m.dead) badges.push(`<span class="badge" style="background:#ff555522;color:#ff5555;border:1px solid #ff5555">☠ 데드 코드 후보</span>`);
      if (m.extends) badges.push(`<span class="badge" style="background:#9B59B622;color:#9B59B6;border:1px solid #9B59B6">extends ${esc(m.extends)}</span>`);
      (m.implements || []).forEach(i => badges.push(`<span class="badge" style="background:#9B59B622;color:#9B59B6;border:1px solid #9B59B6">implements ${esc(i)}</span>`));

      dc.classList.remove('empty');
      dc.innerHTML = `
        <div class="detail-card">
          <div class="label">노드</div>
          <div class="value">${esc(lbl)}</div>
          ${lbl !== id ? `<div style="font-family:monospace;font-size:10px;color:#7e8a99;margin-top:4px;word-break:break-all">${esc(id)}</div>` : ''}
          <div style="margin-top:6px">${badges.join(' ')}</div>
        </div>
        ${m.api  ? `<div class="detail-card"><div class="label">API 엔드포인트</div><div class="value" style="font-family:monospace;font-size:12px;color:#9fd3ff">${esc(m.api)}</div></div>` : ''}
        ${m.note ? `<div class="detail-card"><div class="label">설명</div><div class="value" style="font-size:12px;line-height:1.65;white-space:pre-wrap">${esc(m.note)}</div></div>` : ''}
        ${flowCards(m)}
        ${m.file ? `<div class="detail-card"><div class="label">파일</div><div class="value" style="font-family:monospace;font-size:11px">${esc(m.file)}${m.line ? ':' + esc(m.line) : ''}</div></div>` : ''}
        ${m.signature ? `<div class="detail-card"><div class="label">시그니처</div><div class="value" style="font-family:monospace;font-size:11px;white-space:pre-wrap">${esc(m.signature)}</div></div>` : ''}
        ${m.annotations && m.annotations.length ? `<div class="detail-card"><div class="label">애노테이션</div><div class="value" style="font-family:monospace;font-size:11px">${esc(m.annotations.join(' '))}</div></div>` : ''}
        ${m.dead && m.deadReason ? `<div class="detail-card"><div class="label">데드 코드 사유</div><div class="value" style="font-size:11px">${esc(m.deadReason)} (정적 분석 기준, 리플렉션 등 동적 호출 미탐지 — 삭제 전 확인 필요)</div></div>` : ''}
        ${m.methods && m.methods.length ? `<div class="detail-card"><div class="label">메서드 (${m.methods.length})</div><div class="value" style="font-size:11px">${esc(m.methods.join(', '))}</div></div>` : ''}
        <div class="detail-card"><div class="label">연결 수</div><div class="value" style="font-size:12px">← 호출처 ${m.inDegree ?? connEdges.filter(e => e.to === id).length}개 · 호출 대상 → ${m.outDegree ?? connEdges.filter(e => e.from === id).length}개</div></div>
        ${outgoing ? `<div class="detail-card"><div class="label">호출 대상 (→ ${connEdges.filter(e => e.from === id).length}개)</div><ul class="conn-list">${outgoing}</ul></div>` : ''}
        ${incoming ? `<div class="detail-card"><div class="label">호출처 (← ${connEdges.filter(e => e.to === id).length}개)</div><ul class="conn-list">${incoming}</ul></div>` : ''}
      `;
      network.selectNodes([id]);
    }

    network.on('click', params => {
      if (!params.nodes.length) {
        const dc = document.getElementById('detailContent');
        dc.classList.add('empty');
        dc.innerHTML = currentView === 'module' ? '모듈을 클릭하면 내부 호출 관계를 볼 수 있습니다.' : '노드를 클릭하세요.';
        return;
      }
      const id = params.nodes[0];
      if (currentView === 'module') {
        if (id.startsWith('module:')) enterFunctionView(id.slice('module:'.length));
        return;
      }
      revealNeighbors(id);
      showDetail(id);
    });

    // 아래 세 함수(resetHighlight/doubleClick/collapseToHubBtn)는 전부 "현재 화면에 있는
    // 노드(expandedIds)"만 순회한다 — 예전에는 nodesData(3,857개) 전체를 매번 순회하며
    // 개별 nodes.update()를 호출해서(배치도 안 됨) 클릭할 때마다 눈에 띄게 느렸다.
    function resetHighlight() {
      nodes.update([...expandedIds].map(id => ({ id, opacity: baseOpacity[id] })));
    }

    network.on('doubleClick', params => {
      if (!params.nodes.length) { resetHighlight(); return; }
      const id = params.nodes[0];
      const keep = new Set([id, ...network.getConnectedNodes(id)]);
      nodes.update([...expandedIds].map(nid => ({ id: nid, opacity: keep.has(nid) ? baseOpacity[nid] : 0.15 })));
    });

    document.getElementById('resetHighlightBtn').addEventListener('click', resetHighlight);

    document.getElementById('collapseToHubBtn').addEventListener('click', () => {
      // 단순히 숨기는(hidden) 게 아니라 DataSet에서 실제로 제거한다 — 그래야 펼쳤다 줄였다를
      // 반복해도 DataSet이 계속 커지지 않고 성능이 유지된다. collapseTargetIds는
      // enterFunctionView가 진입할 때마다 갱신한다(전체 뷰=전역 허브+이웃, 모듈 상세뷰=그
      // 모듈의 초기 축소 집합) — 두 경우 모두 이 한 핸들러로 처리된다.
      const toRemove = [...expandedIds].filter(id => !collapseTargetIds.has(id));
      if (toRemove.length) {
        const removeSet = new Set(toRemove);
        const edgeIdsToRemove = [];
        addedEdgeIds.forEach(eid => {
          const e = edgesData[eid];
          if (removeSet.has(e.from) || removeSet.has(e.to)) edgeIdsToRemove.push(eid);
        });
        if (edgeIdsToRemove.length) {
          edges_ds.remove(edgeIdsToRemove);
          edgeIdsToRemove.forEach(eid => addedEdgeIds.delete(eid));
        }
        nodes.remove(toRemove);
        toRemove.forEach(id => expandedIds.delete(id));
      }
      applyTypeFilterAndColor();
      updateChromeForView();
    });

    document.getElementById('backToModulesBtn').addEventListener('click', renderModuleOverview);
    document.getElementById('flatViewBtn').addEventListener('click', () => enterFunctionView(null));

    document.getElementById('physicsToggle').addEventListener('click', function() {
      physicsOn = !physicsOn;
      syncPhysicsBtn();
      network.setOptions({ physics: { enabled: physicsOn } });
    });

    document.getElementById('findBtn').addEventListener('click', () => {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      if (!q) return;
      if (currentView === 'module') {
        const hitM = MODULE_NODES.find(m => m.label.toLowerCase().includes(q) || m.id.toLowerCase().includes(q));
        if (hitM) enterFunctionView(hitM.id);
        return;
      }
      // 모듈 상세뷰에서는 그 모듈 안에서만 찾는다 — 다른 모듈 결과가 튀어나오면
      // "이 모듈만 본다"는 드릴다운 맥락이 깨진다.
      const pool = currentModule === null ? nodesData : nodesData.filter(n => n.module === currentModule);
      const hit = pool.find(n => {
        const m = META[n.id] || {};
        return n.id.toLowerCase().includes(q) || n.label.toLowerCase().includes(q) || (m.file || '').toLowerCase().includes(q);
      });
      if (hit) {
        revealNeighbors(hit.id);
        network.focus(hit.id, { scale: 1.35, animation: true });
        showDetail(hit.id);
      }
    });

    document.getElementById('searchInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('findBtn').click();
    });

    // 타입 필터 적용 + 색상 복원 — 화면에 있는(expandedIds) 노드만, 한 번의 batched
    // nodes.update() 호출로 처리한다. 예전에는 nodesData(3,857개) 전체를 forEach로 돌며
    // 노드마다 개별 nodes.update()를 호출해서(3,857번의 개별 DataSet 트랜잭션) 필터 버튼
    // 하나 누를 때마다 눈에 띄게 느렸다.
    function applyTypeFilterAndColor() {
      nodes.update([...expandedIds].map(id => {
        const t = nodeTypeMap[id];
        return { id, hidden: !activeTypes.has(t), color: nodeColor(t) };
      }));
    }

    document.querySelectorAll('.filter-btn[data-type]').forEach(btn => {
      btn.addEventListener('click', () => {
        const type = btn.dataset.type;
        if (type === 'all') {
          const allOn = activeTypes.size === allTypes.length;
          activeTypes.clear();
          if (!allOn) allTypes.forEach(t => activeTypes.add(t));
          document.querySelectorAll('.filter-btn:not([data-type="all"])').forEach(b => b.classList.toggle('active', activeTypes.has(b.dataset.type)));
        } else {
          if (activeTypes.has(type)) activeTypes.delete(type); else activeTypes.add(type);
          btn.classList.toggle('active', activeTypes.has(type));
        }
        applyTypeFilterAndColor();
      });
    });

    // 검색창 실시간 하이라이트도 같은 이유로 expandedIds만, 한 번의 batched 호출로 처리한다.
    // 숨겨진(아직 안 펼쳐진) 노드는 어차피 화면에 없으니 여기서 색을 바꿀 이유가 없다 —
    // 그 노드를 찾으려면 "찾기" 버튼(revealNeighbors 경유)을 쓴다.
    document.getElementById('searchInput').addEventListener('input', e => {
      const q = e.target.value.trim().toLowerCase();
      nodes.update([...expandedIds].map(id => {
        const n = nodeById.get(id);
        const type = nodeTypeMap[id];
        if (!q) return { id, color: nodeColor(type) };
        const match = n.label.toLowerCase().includes(q);
        const c = COLORS[type] || { bg: '#1e293b', border: '#334155' };
        return {
          id,
          color: match
            ? { background: c.border, border: '#fff', highlight: { background: '#fff', border: c.border } }
            : { background: '#333', border: '#555' }
        };
      }));
    });

    // 부팅: 모듈이 2개 이상이어야 "개요" 역할을 한다. 1개 이하(모노리식 네임스페이스라 패키지
    // 구분이 안 되는 경우 등)면 모듈 개요가 무의미하므로 바로 전체 함수 그래프로 시작한다.
    if (MODULE_NODES.length >= 2) {
      renderModuleOverview();
    } else {
      enterFunctionView(null);
    }
  </script>
</body>
</html>
